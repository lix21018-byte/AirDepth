name: AirDepthMocap
options:
  bundleIdPrefix: com.deepth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone (including iPhone Air)
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  AirDepthMocap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AirDepthMocap
    info:
      path: AirDepthMocap/Info.plist
      properties:
        CFBundleDisplayName: "AirDepth动捕"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: "需要使用 iPhone Air 前置原深感 (TrueDepth) 摄像头采集面部 52 个表情系数、红外深度图以及上半身 3D 动作。"
        NSMicrophoneUsageDescription: "需要使用麦克风同步录制动作参考音轨（可选）。"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepth.airdepthmocap
        INFOPLIST_FILE: AirDepthMocap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
